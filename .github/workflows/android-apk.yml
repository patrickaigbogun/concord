name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'clients/app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK & NDK
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Setup Rust (Android aarch64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/app/src-tauri

      - name: Install JS dependencies
        run: bun install

      - name: Build mobile web bundle
        run: bun run build:mobile

      - name: Initialize Tauri Android & apply Concord icons
        run: |
          bunx tauri android init --ci
          bunx tauri icon src-tauri/icons/concord-icon-1024.png

      - name: Build optimized Release Android APK (aarch64)
        run: bunx tauri android build --apk --target aarch64

      - name: Align & sign Release APK
        run: |
          RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "No APK found!"
            exit 1
          fi
          echo "Found raw APK: $RAW_APK"
          ls -lh "$RAW_APK"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          KEYSTORE="/tmp/concord-release.keystore"
          keytool -genkey -v -keystore "$KEYSTORE" \
            -storepass concord2026 -keypass concord2026 \
            -alias concord -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Concord, OU=Dexx Systems, O=Dexx Systems, L=Earth, S=Global, C=US"

          "$BUILD_TOOLS/zipalign" -v -p 4 "$RAW_APK" concord-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass pass:concord2026 \
            --key-pass pass:concord2026 \
            --ks-key-alias concord \
            --out concord-android-arm64.apk \
            concord-aligned.apk
          "$BUILD_TOOLS/apksigner" verify concord-android-arm64.apk
          ls -lh concord-android-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: concord-android-arm64
          path: clients/app/concord-android-arm64.apk
          retention-days: 30

      - name: Publish to GitHub Release (latest-android)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-android"
          TITLE="Concord Android (Latest)"
          APK_SIZE=$(du -h concord-android-arm64.apk | cut -f1)
          NOTES="Optimized release arm64 APK (${APK_SIZE}) from commit ${{ github.sha }}."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" concord-android-arm64.apk --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --target "${{ github.sha }}"
          else
            gh release create "$TAG" concord-android-arm64.apk \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          fi
